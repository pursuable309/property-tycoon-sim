# ui-check sweep on GitHub Actions (shared core). Shipped into the app's mirror as
# .github/workflows/ui.yml by gh_ui.sh: edit the canonical .scripts/ui_check/ci/ui.yml, never
# an app's core/ copy or the mirror's copy.
#
# Each `ui/<id>` (or `ui/<app>/<id>`) branch is a one-commit snapshot of the app (only what
# its ci.json ships), the ui-check files and a job.json {app, core, url, start, install, args,
# flags, shards, csp, head}. plan checks job.json and expands it to one runner per shard; each
# shard installs what job.json asks for (pinned: npm lockfile, pip requirements with pins and hashes),
# starts the app (static-serve.js or the app's ci/start.sh), launches Chromium
# (ui_check.js --ci) and runs every N-th case; merge combines them into one report and uploads
# it as the `ui-report` artifact, which `gh_ui.sh fetch` downloads. Nothing is ever pushed
# back: the whole workflow runs with a read-only token. Workflow values reach the shell as env
# vars, never pasted into a script.
name: ui
on:
  push:
    branches: ['ui/**']
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.m.outputs.shards }}
      n: ${{ steps.m.outputs.n }}
      app: ${{ steps.m.outputs.app }}
      core: ${{ steps.m.outputs.core }}
      url: ${{ steps.m.outputs.url }}
      start: ${{ steps.m.outputs.start }}
      pipreq: ${{ steps.m.outputs.pipreq }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - id: m
        run: |
          node -e '
            const fs = require("fs");
            const j = require("./job.json");
            const die = m => { console.error("job.json: " + m); process.exit(1); };
            const n = j.shards;
            if (!Number.isInteger(n) || n < 1 || n > 20) die("shards must be 1-20");
            // Repo-relative dirs: plain characters, no "..", no leading slash
            const rel = p => typeof p === "string" && /^[A-Za-z0-9._-]+(\/[A-Za-z0-9._-]+)*$/.test(p) && !p.split("/").includes("..") && p.length < 200;
            if (!rel(j.app) || !rel(j.core)) die("app/core must be plain repo-relative paths");
            if (!fs.existsSync(j.core + "/ui_check.js") || !fs.existsSync(j.app + "/config.json")) die("no ui_check.js / config.json at app/core");
            if (typeof j.url !== "string" || !/^http:\/\/(127\.0\.0\.1|localhost):[0-9]{2,5}\/[A-Za-z0-9._\/-]*$/.test(j.url)) die("url must be http on localhost");
            const st = j.start || {};
            let start;
            if (st.static && typeof st.static === "object") start = "static";
            else if (st.script === true) { start = "script"; if (!fs.existsSync(j.app + "/ci/start.sh")) die("start.script without " + j.app + "/ci/start.sh"); }
            else die("start must be {static: {...}} or {script: true}");
            const req = (j.install || {}).pipRequirements || "";
            if (req && (!rel(req) || !/\.txt$/.test(req) || !fs.existsSync(req))) die("install.pipRequirements must be a shipped .txt file");
            console.log("n=" + n);
            console.log("shards=" + JSON.stringify(Array.from({ length: n }, (_, i) => i + 1)));
            console.log("app=" + j.app); console.log("core=" + j.core); console.log("url=" + j.url);
            console.log("start=" + start); console.log("pipreq=" + req);
          ' >> "$GITHUB_OUTPUT"
  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ needs.plan.outputs.n }}
      APP: ${{ needs.plan.outputs.app }}
      CORE: ${{ needs.plan.outputs.core }}
      URL: ${{ needs.plan.outputs.url }}
      START: ${{ needs.plan.outputs.start }}
      PIPREQ: ${{ needs.plan.outputs.pipreq }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned playwright-core and Chromium
        run: |
          # Lockfile install (exact version + integrity hash), no install scripts
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$CORE/ci"
          node "$CORE/ci/node_modules/playwright-core/cli.js" install --with-deps --no-shell chromium
      - name: Render system-ui and sans-serif in Roboto (the phone's font)
        run: |
          # Chrome on Android draws the apps' font stack in Roboto; the runner would fall back
          # to the wider DejaVu Sans and report text cuts the phone never shows. Roboto from
          # the signed Ubuntu archive, mapped by a user fontconfig file (the same one as in
          # proot: .scripts/ui_check/README.md "Fonts").
          sudo apt-get install -y --no-install-recommends fonts-roboto-unhinted
          mkdir -p "$HOME/.config/fontconfig"
          cat > "$HOME/.config/fontconfig/fonts.conf" <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
            <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
            <alias binding="strong"><family>sans</family><prefer><family>Roboto</family></prefer></alias>
          </fontconfig>
          EOF
          fc-match system-ui | grep -q Roboto || { fc-match system-ui; echo "Roboto mapping failed"; exit 1; }
      - name: Install the app's Python packages (pinned, hashed requirements, wheels only)
        if: needs.plan.outputs.pipreq != ''
        run: |
          # --require-hashes: every package, transitive ones included, must be pinned with the
          # hash of the exact wheel, or the install fails (app ci/requirements.txt files).
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-input --disable-pip-version-check --require-hashes --only-binary=:all: -r "$PIPREQ"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Start the app
        run: |
          if [ "$START" = static ]; then
            nohup node "$CORE/ci/static-serve.js" . job.json > serve.log 2>&1 &
          else
            bash "$APP/ci/start.sh" > serve.log 2>&1
          fi
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "$URL" && exit 0
            sleep 0.5
          done
          cat serve.log; exit 1
      - name: Sweep this shard
        run: |
          # job.json args were checked by gh_ui.sh at submit; check them again here (flags
          # of a plain shape that the runner allows, plain values) and pass them as an argv
          # array, never through a shell. ui_check.js rejects any flag it doesn't know.
          node -e '
            const { spawnSync } = require("child_process");
            const j = require("./job.json");
            const args = j.args || [], flags = j.flags || [];
            const NEVER = new Set(["--ci", "--out", "--shard", "--merge", "--config", "--app", "--baseline", "--prune", "--restart-server", "--no-embed", "--list", "--plan"]);
            if (!Array.isArray(args) || args.length > 40 || !Array.isArray(flags)) { console.error("job.json args must be a short array"); process.exit(1); }
            const ok = f => typeof f === "string" && /^--[a-z][a-z0-9-]{0,30}$/.test(f) && !NEVER.has(f) && flags.includes(f);
            for (let i = 0; i < args.length; i++) {
              if (!ok(args[i])) { console.error("job.json: argument not allowed: " + JSON.stringify(String(args[i]).slice(0, 60))); process.exit(1); }
              if (/^[A-Za-z0-9*,._-]{1,255}$/.test(String(args[i + 1])) && !String(args[i + 1]).startsWith("-")) i++;
            }
            const shard = `${process.env.SHARD}/${process.env.SHARDS}`;
            if (!/^\d{1,2}\/\d{1,2}$/.test(shard)) process.exit(1);
            const r = spawnSync(process.execPath, [process.env.CORE + "/ui_check.js", "--app", process.env.APP, ...args,
              "--ci", "--shard", shard, "--out", "out"], { stdio: "inherit" });
            // 0 = clean or check failures, 3 = some cases could not be built (shown as ERR
            // cells in the report): both leave a results.json to merge.
            process.exit(r.status === 0 || r.status === 3 ? 0 : (r.status || 1));
          '
          echo "node $(node -v) on $(nproc) vCPU" >> out/runner.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore
          retention-days: 3
  merge:
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ID: ${{ github.run_id }}
      SHARD_RESULT: ${{ needs.shard.result }}
      SHARDS: ${{ needs.plan.outputs.n }}
      APP: ${{ needs.plan.outputs.app }}
      CORE: ${{ needs.plan.outputs.core }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: shard-*
          path: shards
      - name: Merge the shards into one report
        run: |
          dirs=""
          # download-artifact unpacks a lone matching artifact straight into shards/ (no
          # shard-1/ folder), so a 1-shard run's results are at shards/results.json
          for d in shards/shard-* shards; do [ -f "$d/results.json" ] && dirs="$dirs${dirs:+,}$d"; done
          [ -n "$dirs" ] || { echo "no shard produced results"; exit 1; }
          node "$CORE/ui_check.js" --app "$APP" --merge "$dirs" --out report || [ $? -eq 3 ]
          node -e '
            const fs = require("fs"), merged = process.argv[1].split(",").length;
            fs.writeFileSync("report/ci-run.json", JSON.stringify({ runId: Number(process.env.RUN_ID),
              shards: Number(process.env.SHARDS), merged, shardResult: process.env.SHARD_RESULT,
              node: process.version, finishedAt: new Date().toISOString() }, null, 1) + "\n");
          ' "$dirs"
          cat report/ci-run.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: ui-report
          path: report/
          retention-days: 14
